name: Build Setup EXE

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.4.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4

    - name: Publish WinUI Tray App (x64)
      run: dotnet publish src/OpenClaw.Tray.WinUI -c Release -r win-x64 --self-contained -p:Version=${{ steps.gitversion.outputs.semVer }} -o publish

    - name: Build Installer (Inno Setup)
      run: |
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.gitversion.outputs.semVer }}" /DMyAppArch=x64 /Dpublish=publish installer.iss        

    - name: Upload Setup EXE
      uses: actions/upload-artifact@v7
      with:
        name: OpenClawTray-Setup-x64
        path: Output/OpenClawTray-Setup-x64.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Output/OpenClawTray-Setup-x64.exe
        generate_release_notes: true
